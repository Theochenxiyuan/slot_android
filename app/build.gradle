plugins {
    id 'com.android.application'
}

def signingPropertiesPath = providers.environmentVariable('SLOT_SIGNING_PROPERTIES')
        .orElse(providers.gradleProperty('slotSigningProperties')).orNull
def releaseSigning = null
def releaseKeyStore = null
if (signingPropertiesPath) {
    def propertiesFile = file(signingPropertiesPath)
    if (!propertiesFile.isFile()) throw new GradleException('Release signing properties file not found')
    releaseSigning = new Properties()
    propertiesFile.withInputStream { releaseSigning.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        if (!releaseSigning.getProperty(key)?.trim()) throw new GradleException("Missing release signing property: ${key}")
    }
    releaseKeyStore = new File(releaseSigning.getProperty('storeFile'))
    if (!releaseKeyStore.isAbsolute()) releaseKeyStore = new File(propertiesFile.parentFile, releaseKeyStore.path)
    if (!releaseKeyStore.isFile()) throw new GradleException('Release keystore file not found')
}

android {
    namespace 'fyi.slot.android'
    compileSdk 36

    defaultConfig {
        applicationId 'fyi.slot.android'
        minSdk 31
        targetSdk 36
        versionCode 16
        versionName '0.11.0'
        testInstrumentationRunner 'fyi.slot.android.InteractionChecks'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (releaseSigning != null) {
            release {
                storeFile releaseKeyStore
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigning != null) signingConfig signingConfigs.release
        }
    }
    bundle {
        language { enableSplit = false }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'io.nayuki:qrcodegen:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
